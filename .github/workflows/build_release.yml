name: Build Multi-Platform Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. Android Build (APK)
  # ==========================================
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        run: |
          git clone -b 3.32.5 https://github.com/flutter/flutter.git --depth 1 $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Doctor and Licenses
        run: |
          flutter doctor -v
          yes | flutter doctor --android-licenses || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee android.log

      - name: Report Android Failure
        if: failure()
        run: |
          echo "### Android Build Error" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 60 android.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Locate and Package Android APK
        run: |
          mkdir -p android-dist
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-release.apk" android-dist/klpbbs-android-release.apk
          else
            APK_FILE=$(find build -name "*.apk" -type f | head -n 1)
            cp "$APK_FILE" android-dist/klpbbs-android-release.apk
          fi
          ls -lh android-dist/

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: klpbbs-android-apk
          path: android-dist/klpbbs-android-release.apk

  # ==========================================
  # 2. Windows Build (x64 Release ZIP)
  # ==========================================
  build-windows:
    name: Build Windows
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        shell: pwsh
        run: |
          git clone -b 3.32.5 https://github.com/flutter/flutter.git --depth 1 $env:USERPROFILE\flutter
          "$env:USERPROFILE\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Doctor Check
        run: flutter doctor -v

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Windows Release
        shell: pwsh
        env:
          PreferredToolArchitecture: x64
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath windows.log
          if ($LASTEXITCODE -ne 0) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Windows Build Error"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
            Get-Content windows.log -Tail 60 | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
            exit $LASTEXITCODE
          }

      - name: Package Windows Binary
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "build\windows" -Filter "*.exe" -Recurse | Where-Object { $_.DirectoryName -match "Release" } | Select-Object -First 1
          if ($exe) {
              $releaseDir = $exe.DirectoryName
              Write-Host "Found Release Dir: $releaseDir"
              Compress-Archive -Path "$releaseDir\*" -DestinationPath "klpbbs-windows-x64.zip" -Force
          } else {
              $releaseDir = (Get-Item -Path "build\windows\*\runner\Release", "build\windows\runner\Release" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
              Write-Host "Fallback Release Dir: $releaseDir"
              Compress-Archive -Path "$releaseDir\*" -DestinationPath "klpbbs-windows-x64.zip" -Force
          }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: klpbbs-windows-x64
          path: klpbbs-windows-x64.zip

  # ==========================================
  # 3. macOS Build (.app ZIP)
  # ==========================================
  build-macos:
    name: Build macOS
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        run: |
          git clone -b 3.32.5 https://github.com/flutter/flutter.git --depth 1 $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Enable macOS Desktop Support
        run: flutter config --enable-macos-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: |
          set -o pipefail
          flutter build macos --release 2>&1 | tee macos.log

      - name: Report macOS Failure
        if: failure()
        run: |
          echo "### macOS Build Error" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 60 macos.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Package macOS Binary
        run: |
          APP_PATH=$(find build/macos -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cd "$(dirname "$APP_PATH")"
            zip -r "$GITHUB_WORKSPACE/klpbbs-macos.zip" "$(basename "$APP_PATH")"
          fi

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: klpbbs-macos
          path: klpbbs-macos.zip

  # ==========================================
  # 4. iOS Build (Unsigned IPA)
  # ==========================================
  build-ios:
    name: Build iOS
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        run: |
          git clone -b 3.32.5 https://github.com/flutter/flutter.git --depth 1 $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Enable iOS Support
        run: flutter config --enable-ios

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS Release (Unsigned)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee ios.log

      - name: Report iOS Failure
        if: failure()
        run: |
          echo "### iOS Build Error" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 60 ios.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Package iOS IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/ios -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" Payload/
            zip -r klpbbs-ios-unsigned.ipa Payload
          fi

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: klpbbs-ios-unsigned
          path: klpbbs-ios-unsigned.ipa

  # ==========================================
  # 5. Linux Build (x64 TAR.GZ)
  # ==========================================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev mpv libnotify-dev libayatana-appindicator3-dev libsecret-1-dev libjsoncpp-dev

      - name: Setup Flutter
        run: |
          git clone -b 3.32.5 https://github.com/flutter/flutter.git --depth 1 $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Enable Linux Desktop Support
        run: flutter config --enable-linux-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: |
          set -o pipefail
          flutter build linux --release 2>&1 | tee linux.log

      - name: Report Linux Failure
        if: failure()
        run: |
          echo "### Linux Build Error" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 60 linux.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Package Linux Binary
        run: |
          RELEASE_DIR=$(find build/linux -name "bundle" -type d | head -n 1)
          if [ -n "$RELEASE_DIR" ]; then
            tar -czvf klpbbs-linux-x64.tar.gz -C "$RELEASE_DIR" .
          fi

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: klpbbs-linux-x64
          path: klpbbs-linux-x64.tar.gz

  # ==========================================
  # 6. Create GitHub Release
  # ==========================================
  release:
    name: Publish Release Artifacts
    needs: [build-android, build-windows, build-macos, build-ios, build-linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-files

      - name: Flatten Artifacts Directory
        run: |
          mkdir -p ./all-releases
          find ./release-files -type f -exec cp {} ./all-releases/ \;
          ls -lh ./all-releases

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.4' }}
          files: ./all-releases/*
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
