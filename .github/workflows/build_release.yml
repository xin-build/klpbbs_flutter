name: Build Multi-Platform Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        default: all
        options:
          - all
          - android
      source_ref:
        description: Optional source branch, tag, or commit
        type: string
        default: ''

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  analyze:
    name: Analyze Application
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Application Code
        run: |
          set -o pipefail
          dart analyze lib 2>&1 | tee analyze.log

      - name: Upload Analysis Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-analysis
          path: analyze.log
          if-no-files-found: ignore

  # ==========================================
  # 1. Android Build (APK)
  # ==========================================
  build-android:
    name: Build Android
    needs: analyze
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Doctor and Licenses
        run: |
          flutter doctor -v
          yes | flutter doctor --android-licenses || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64 2>&1 | tee android.log

      - name: Upload Android Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-android
          path: android.log

      - name: Locate and Package Android APK
        run: |
          mkdir -p android-dist
          for variant in armeabi-v7a:arm32 arm64-v8a:arm64 x86_64:x86_64; do
            IFS=: read -r abi release_arch <<< "$variant"
            apk="build/app/outputs/flutter-apk/app-$abi-release.apk"
            test -s "$apk"
            cp "$apk" "android-dist/klpbbs-android-$release_arch.apk"
          done
          ls -lh android-dist/

      - name: Verify Android APK Architectures and Signatures
        run: |
          python3 - <<'PY'
          import pathlib
          import zipfile

          expected = {
              'klpbbs-android-arm32.apk': 'armeabi-v7a',
              'klpbbs-android-arm64.apk': 'arm64-v8a',
              'klpbbs-android-x86_64.apk': 'x86_64',
          }
          for filename, abi in expected.items():
              apk = pathlib.Path('android-dist') / filename
              with zipfile.ZipFile(apk) as archive:
                  corrupt = archive.testzip()
                  if corrupt is not None:
                      raise SystemExit(f'{filename}: corrupt ZIP entry {corrupt}')
                  libraries = {
                      name for name in archive.namelist()
                      if name.startswith('lib/') and name.endswith('.so')
                  }
                  actual = {name.split('/')[1] for name in libraries}
                  if actual != {abi}:
                      raise SystemExit(f'{filename}: expected {abi}, found {actual}')
                  for library in ('libapp.so', 'libflutter.so', 'libmpv.so'):
                      if f'lib/{abi}/{library}' not in libraries:
                          raise SystemExit(f'{filename}: missing {library}')
              print(f'{filename}: verified {abi}, {apk.stat().st_size:,} bytes')
          PY
          apksigner=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          test -n "$apksigner"
          for apk in android-dist/*.apk; do
            verification=$("$apksigner" verify --verbose --print-certs "$apk")
            printf '%s\n' "$verification"
            grep -Eq '^Number of signers: 1$' <<< "$verification"
            grep -Eq '^(Signer #[[:digit:]]+ |V[[:digit:].]+ Signer: )certificate SHA-256 digest: 5803cf1723db96f6d4c5fee9985dbc8d3b21c9715645b04b2690782f1be3297b$' <<< "$verification"
          done

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: klpbbs-android-apk
          path: android-dist/*.apk
          if-no-files-found: error

  # ==========================================
  # 2. Windows Build (x64 Release ZIP)
  # ==========================================
  build-windows:
    name: Build Windows
    needs: analyze
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all'
    timeout-minutes: 45
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Doctor Check
        run: flutter doctor -v

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Windows Release
        shell: pwsh
        env:
          PreferredToolArchitecture: x64
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-windows
          path: windows.log

      - name: Package Windows Binary
        shell: pwsh
        run: |
          $releaseDir = Resolve-Path "build\windows\*\runner\Release" | Select-Object -ExpandProperty Path -First 1
          if (-not $releaseDir) { $releaseDir = Resolve-Path "build\windows\runner\Release" | Select-Object -ExpandProperty Path -First 1 }
          Write-Host "Found Release Dir: $releaseDir"
          Get-ChildItem -Path $releaseDir | Compress-Archive -DestinationPath "klpbbs-windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: klpbbs-windows-x64
          path: klpbbs-windows-x64.zip
          if-no-files-found: error

  # ==========================================
  # 3. macOS Build (.app ZIP)
  # ==========================================
  build-macos:
    name: Build macOS
    needs: analyze
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all'
    timeout-minutes: 45
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop Support
        run: flutter config --enable-macos-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: |
          set -o pipefail
          flutter build macos --release 2>&1 | tee macos.log

      - name: Upload macOS Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-macos
          path: macos.log

      - name: Package macOS Binary
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" -type d -print -quit)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$GITHUB_WORKSPACE/klpbbs-macos.zip"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: klpbbs-macos
          path: klpbbs-macos.zip
          if-no-files-found: error

  # ==========================================
  # 4. iOS Build (Unsigned IPA)
  # ==========================================
  build-ios:
    name: Build iOS
    needs: analyze
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all'
    timeout-minutes: 45
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Enable iOS Support
        run: flutter config --enable-ios

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS Release (Unsigned)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee ios.log

      - name: Upload iOS Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-ios
          path: ios.log

      - name: Package iOS IPA
        run: |
          mkdir -p Payload
          APP_PATH=build/ios/iphoneos/Runner.app
          test -d "$APP_PATH"
          ditto "$APP_PATH" Payload/Runner.app
          zip -r klpbbs-ios-unsigned.ipa Payload

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: klpbbs-ios-unsigned
          path: klpbbs-ios-unsigned.ipa
          if-no-files-found: error

  # ==========================================
  # 5. Linux Build (x64 TAR.GZ)
  # ==========================================
  build-linux:
    name: Build Linux
    needs: analyze
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all'
    timeout-minutes: 45
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev mpv libnotify-dev libayatana-appindicator3-dev libsecret-1-dev libjsoncpp-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop Support
        run: flutter config --enable-linux-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: |
          set -o pipefail
          flutter build linux --release 2>&1 | tee linux.log

      - name: Upload Linux Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-linux
          path: linux.log

      - name: Package Linux Binary
        run: |
          RELEASE_DIR=$(find build/linux -name "bundle" -type d | head -n 1)
          tar -czvf klpbbs-linux-x64.tar.gz -C "$RELEASE_DIR" .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: klpbbs-linux-x64
          path: klpbbs-linux-x64.tar.gz
          if-no-files-found: error

  # ==========================================
  # 6. Create GitHub Release
  # ==========================================
  release:
    name: Publish Release Artifacts
    needs: [build-android, build-windows, build-macos, build-ios, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-files

      - name: Flatten Artifacts Directory
        run: |
          mkdir -p ./all-releases
          find ./release-files -type f -not -name "*.log" -exec cp {} ./all-releases/ \;
          ls -lh ./all-releases

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.6' }}
          files: ./all-releases/*
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true

