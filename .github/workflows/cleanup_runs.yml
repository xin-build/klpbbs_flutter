name: Cleanup Old Workflow Runs

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Clean Old & Failed Runs
    runs-on: ubuntu-latest
    steps:
      - name: Delete Old & Failed Workflow Runs
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const currentRunId = context.runId;
            console.log(`Total workflow runs found: ${runs.data.total_count}`);
            for (const run of runs.data.workflow_runs) {
              // Delete all previous runs, especially failed or cancelled ones
              if (run.id !== currentRunId) {
                try {
                  console.log(`Deleting run ${run.id} (${run.name} | ${run.event} | ${run.status} / ${run.conclusion})...`);
                  await github.rest.actions.deleteWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id
                  });
                  console.log(`Successfully deleted run ${run.id}`);
                } catch (err) {
                  console.log(`Could not delete run ${run.id}: ${err.message}`);
                }
              }
            }
